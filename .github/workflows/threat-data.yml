# NovaGuard 위협 데이터: 매일 새벽 4시(한국 시간)에 모아 서명해서 'threat-data' 릴리즈에 올린다.
# 필요: 저장소 Settings > Secrets and variables > Actions 에 NOVAGUARD_UPDATE_KEY
#       (installer/cert/novaguard_update_key.pem 내용 전체)
name: threat-data
on:
  schedule:
    - cron: '0 19 * * *'      # UTC 19:00 = 한국 04:00
  workflow_dispatch: {}        # Actions 화면에서 바로 실행
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 위협 정보 모으기
        run: python3 tools/build_threat.py --out novaguard-threat.txt
      - name: 서명
        env:
          KEY: ${{ secrets.NOVAGUARD_UPDATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > key.pem
          openssl dgst -sha256 -sign key.pem -out novaguard-threat.txt.sig novaguard-threat.txt
          rm -f key.pem
      - name: 릴리즈에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view threat-data >/dev/null 2>&1 || \
            gh release create threat-data --title "위협 데이터 (매일 자동 갱신)" \
              --notes "NovaGuard 가 매일 받는 위협 데이터입니다. 프로그램 릴리즈가 아닙니다." --latest=false
          gh release upload threat-data novaguard-threat.txt novaguard-threat.txt.sig --clobber
